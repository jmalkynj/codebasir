[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebasir"
version = "0.1.0"
description = "Arabic developer tool that explains programming errors and suggests solutions."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Jamal Almarhabi" }
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
codebasir = "codebasir.cli:main"
